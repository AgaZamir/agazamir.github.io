<!DOCTYPE html>
<html lang="pl">
<head>

<!-- Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-8JRXH47R3Y"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-8JRXH47R3Y');
</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aga Zamirska</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:'Inter', sans-serif;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:flex-end;
  padding-bottom:6vh;
  color:white;
  text-align:center;

  /* HERO IMAGE + CINEMATIC GRADIENT */
  background:
  linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.55) 35%, rgba(0,0,0,0.2) 60%, rgba(0,0,0,0.1) 100%),
  url('aga.jpg') center 25% / cover no-repeat fixed;
}

/* glass card */
.card{
  backdrop-filter: blur(12px);
  background: rgba(0,0,0,0.35);
  border-radius:20px;
  padding:30px 28px;
  width:88%;
  max-width:420px;
  box-shadow:0 10px 30px rgba(0,0,0,0.35);
  animation:fade 1.2s ease;
}

@keyframes fade{
  from{opacity:0; transform:translateY(25px)}
  to{opacity:1; transform:translateY(0)}
}

/* typography */
h1{
  font-family:'Playfair Display', serif;
  font-size:2.4rem;
  margin:0;
  letter-spacing:1px;
}

.small-name{
  display:block;
  font-size:1rem;
  font-weight:300;
  opacity:0.85;
  margin-top:6px;
}

.tagline{
  margin-top:18px;
  font-size:1.05rem;
  opacity:0.9;
}

/* language buttons */
.lang{ margin-top:20px; }

.lang button{
  background:transparent;
  border:1px solid rgba(255,255,255,0.5);
  color:white;
  padding:6px 16px;
  border-radius:20px;
  margin:4px;
  cursor:pointer;
  transition:0.3s;
}

.lang button:hover{
  background:white;
  color:black;
}

/* social buttons */
.social{ margin-top:22px; }

.social a{
  display:inline-block;
  margin:6px;
  padding:9px 18px;
  border-radius:30px;
  text-decoration:none;
  color:white;
  border:1px solid rgba(255,255,255,0.4);
  transition:0.3s;
  font-size:0.9rem;
}

.social a:hover{
  background:white;
  color:black;
  transform:translateY(-2px);
}

@media(max-width:768px){
  h1{font-size:2rem}
}
</style>
</head>

<body>

<div class="card">

  <h1>
    Aga Zamirska
    <span class="small-name">Agata Zamirska</span>
  </h1>

  <p id="text-pl" class="tagline">
    Oficjalna strona w przygotowaniu<br>
    Obserwuj mnie tutaj:
  </p>

  <p id="text-en" class="tagline" style="display:none;">
    Official website coming soon<br>
    Follow me here:
  </p>

  <div class="lang">
    <button onclick="showLang('pl')">PL</button>
    <button onclick="showLang('en')">EN</button>
  </div>

  <div class="social">
    <a href="https://instagram.com/aga.zamirska" target="_blank">Instagram</a>
    <a href="https://www.youtube.com/channel/twoj-link" target="_blank">YouTube</a>
    <a href="https://open.spotify.com/artist/twoj-link" target="_blank">Spotify</a>
  </div>

</div>

<script>
function showLang(lang){
  document.getElementById('text-pl').style.display = (lang==='pl') ? 'block' : 'none';
  document.getElementById('text-en').style.display = (lang==='en') ? 'block' : 'none';
}
</script>

</body>
</html>
