<!DOCTYPE html>
<html lang="pl">
<head>

<!-- Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-8JRXH47R3Y"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-8JRXH47R3Y');
</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aga Zamirska</title>

<!-- Elegant fonts -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

<style>

*{box-sizing:border-box}

body{
  margin:0;
  font-family:'Inter', sans-serif;
  height:100vh;
 display:flex;
justify-content:center;
align-items:flex-end;
padding-bottom:8vh;
  color:white;
  text-align:center;

background:
linear-gradient(rgba(0,0,0,0.55),rgba(0,0,0,0.75)),
url('aga.jpg') center 5% / cover no-repeat fixed;

/* glass card */
.card{
  backdrop-filter: blur(14px);
  background: rgba(255,255,255,0.08);
  border-radius: 24px;
  padding: 50px 40px;
  width: 90%;
  max-width: 520px;
  box-shadow: 0 0 40px rgba(0,0,0,0.35);
  animation: fade 1.2s ease;
}

@keyframes fade{
  from{opacity:0; transform:translateY(20px)}
  to{opacity:1; transform:translateY(0)}
}

/* typography */
h1{
  font-family:'Playfair Display', serif;
  font-size:3rem;
  margin:0;
  letter-spacing:1px;
}

.small-name{
  display:block;
  font-size:1.2rem;
  font-weight:300;
  opacity:0.8;
  margin-top:6px;
}

.tagline{
  margin-top:20px;
  font-size:1.1rem;
  opacity:0.9;
}

/* language buttons */
.lang{
  margin-top:25px;
}

.lang button{
  background:transparent;
  border:1px solid rgba(255,255,255,0.5);
  color:white;
  padding:6px 16px;
  border-radius:20px;
  margin:4px;
  cursor:pointer;
  transition:0.3s;
}

.lang button:hover{
  background:white;
  color:black;
}

/* social buttons */
.social{
  margin-top:30px;
}

.social a{
  display:inline-block;
  margin:8px;
  padding:10px 20px;
  border-radius:30px;
  text-decoration:none;
  color:white;
  border:1px solid rgba(255,255,255,0.4);
  transition:0.3s;
  font-size:0.95rem;
}

.social a:hover{
  background:white;
  color:black;
  transform:translateY(-2px);
}

/* mobile */
@media(max-width:768px){
  h1{font-size:2.3rem}
  .card{padding:40px 25px}
}

</style>
</head>

<body>

<div class="card">

  <h1>
    Aga Zamirska
    <span class="small-name">Agata Zamirska</span>
  </h1>

  <p id="text-pl" class="tagline">
    Oficjalna strona w przygotowaniu<br>
    Obserwuj mnie tutaj:
  </p>

  <p id="text-en" class="tagline" style="display:none;">
    Official website coming soon<br>
    Follow me here:
  </p>

  <div class="lang">
    <button onclick="showLang('pl')">PL</button>
    <button onclick="showLang('en')">EN</button>
  </div>

  <div class="social">
    <a href="https://instagram.com/aga.zamirska" target="_blank">Instagram</a>
    <a href="https://www.youtube.com/channel/twoj-link" target="_blank">YouTube</a>
    <a href="https://open.spotify.com/artist/twoj-link" target="_blank">Spotify</a>
  </div>

</div>

<script>
function showLang(lang){
  document.getElementById('text-pl').style.display = (lang==='pl') ? 'block' : 'none';
  document.getElementById('text-en').style.display = (lang==='en') ? 'block' : 'none';
}
</script>

</body>
</html>
