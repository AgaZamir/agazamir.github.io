<!DOCTYPE html>
<html lang="pl">
<head>

<!-- Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-8JRXH47R3Y"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-8JRXH47R3Y');
</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aga Zamirska</title>

<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@500;700&family=Manrope:wght@300;400;500&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:'Manrope', sans-serif;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:flex-end;
  padding-bottom:6vh;
  color:white;
  text-align:center;

  /* HERO IMAGE + CINEMATIC GRADIENT */
  background:
  linear-gradient(to top, rgba(10,10,20,0.9) 0%, rgba(20,15,35,0.6) 35%, rgba(0,0,0,0.15) 70%, rgba(0,0,0,0.05) 100%),
  url('aga.jpg') center 25% / cover no-repeat fixed;
}
/* ===== ARTISTIC CINEMATIC OVERLAY ===== */

body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:0;

  /* COLOR GRADING + LIGHT LEAKS */
  background:
    radial-gradient(circle at 85% 15%, rgba(255,120,70,0.25), transparent 40%),
    radial-gradient(circle at 10% 90%, rgba(120,90,255,0.25), transparent 40%),
    radial-gradient(circle at center, transparent 55%, rgba(0,0,0,0.7) 100%);
}

/* FILM GRAIN (robiony CSSem – bez plików) */
body::after{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:0;
  opacity:0.25;
  mix-blend-mode:overlay;

  background-image:
    repeating-radial-gradient(circle at 0 0, transparent 0, rgba(255,255,255,0.15) 1px, transparent 2px),
    repeating-linear-gradient(0deg, rgba(0,0,0,0.15) 0, rgba(0,0,0,0.15) 1px, transparent 1px, transparent 2px);
}


/* glass card */
.card{
  position:relative;
  z-index:1;
  backdrop-filter: blur(14px);
  background: rgba(255,255,255,0.08);
  border-radius: 24px;
  padding: 50px 40px;
  width: 90%;
  max-width: 520px;
  box-shadow: 0 0 40px rgba(0,0,0,0.35);
  animation: fade 1.2s ease;
}

@keyframes fade{
  from{opacity:0; transform:translateY(25px)}
  to{opacity:1; transform:translateY(0)}
}

/* typography */
h1{
  font-family:'Bodoni Moda', serif;
  font-size:3.4rem;
  margin:0;
  letter-spacing:0.5px;
  font-weight:700;
  animation: heroFade 1.8s ease forwards;
}

.small-name{
  display:block;
  font-size:1.1rem;
  font-weight:300;
  letter-spacing:2px;
  text-transform:uppercase;
  opacity:0.75;
  margin-top:10px;
  animation: heroFade 2.4s ease forwards;
}

.tagline{
  margin-top:22px;
  font-size:1.05rem;
  opacity:0.85;
  letter-spacing:0.3px;
}
}

/* language buttons */
.lang{ margin-top:20px; }

.lang button{
  background:transparent;
  border:1px solid rgba(255,255,255,0.5);
  color:white;
  padding:6px 16px;
  border-radius:20px;
  margin:4px;
  cursor:pointer;
  transition:0.3s;
}

.lang button:hover{
  background:white;
  color:black;
}

/* social buttons */
.social{ margin-top:22px; }

.social a{
  display:inline-block;
  margin:6px;
  padding:9px 18px;
  border-radius:30px;
  text-decoration:none;
  color:white;
  border:1px solid rgba(255,255,255,0.4);
  transition:0.3s;
  font-size:0.9rem;
}

.social a:hover{
  background:white;
  color:black;
  transform:translateY(-2px);
}

@media(max-width:768px){
  h1{font-size:2rem}
}
  /* fade in hero */
@keyframes heroFade {
  from{
    opacity:0;
    transform:translateY(25px);
    letter-spacing:6px;
  }
  to{
    opacity:1;
    transform:translateY(0);
    letter-spacing:0.5px;
  }
}
</style>
</head>

<body>

<div class="card">

  <h1>
    Aga Zamirska
    <span class="small-name">Agata Zamirska</span>
  </h1>

  <p id="text-pl" class="tagline">
    Oficjalna strona w przygotowaniu<br>
    Obserwuj mnie tutaj:
  </p>

  <p id="text-en" class="tagline" style="display:none;">
    Official website coming soon<br>
    Follow me here:
  </p>

  <div class="lang">
    <button onclick="showLang('pl')">PL</button>
    <button onclick="showLang('en')">EN</button>
  </div>

  <div class="social">
    <a href="https://instagram.com/aga.zamirska" target="_blank">Instagram</a>
    <a href="https://www.youtube.com/channel/twoj-link" target="_blank">YouTube</a>
    <a href="https://open.spotify.com/artist/twoj-link" target="_blank">Spotify</a>
  </div>

</div>

<script>
function showLang(lang){
  document.getElementById('text-pl').style.display = (lang==='pl') ? 'block' : 'none';
  document.getElementById('text-en').style.display = (lang==='en') ? 'block' : 'none';
}
</script>

</body>
</html>
