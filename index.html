<!DOCTYPE html>
<html lang="pl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aga Zamirska</title>

<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@500;700&family=Manrope:wght@300;400;500&display=swap" rel="stylesheet">

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:'Manrope', sans-serif;
  min-height:100vh;

  display:flex;
  justify-content:center;
  align-items:flex-end;
  padding-bottom:8vh;

  text-align:center;
  color:white;

  background:
    url('aga.jpg') center 25% / cover no-repeat fixed;
}

/* GLOBAL LIGHT + CINEMATIC DEPTH */
body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;

  background:
    radial-gradient(circle at 50% 20%, rgba(0,0,0,0.15), transparent 45%),
    radial-gradient(circle at 50% 100%, rgba(0,0,0,0.75), transparent 55%),
    linear-gradient(to top, rgba(0,0,0,0.65), rgba(0,0,0,0.15));

  z-index:0;
}

/* WRAPPER (NO CARD LOOK) */
.card{
  position:relative;
  z-index:2;
  background:transparent;
  border:none;
  box-shadow:none;
  padding:0 20px;
  width:90%;
  max-width:650px;

  animation: fade 1.8s ease;
}

/* TYPOGRAPHY */
h1{
  font-family:'Bodoni Moda', serif;
  font-size:clamp(2.8rem, 6vw, 4.8rem);
  margin:0;

  color:rgba(255,255,255,0.90);
  letter-spacing:0.5px;

  text-shadow:0 25px 60px rgba(0,0,0,0.6);

  animation: heroFade 2s ease forwards;
}

.small-name{
  display:block;
  font-size:0.55rem;
  font-weight:300;
  letter-spacing:3px;
  text-transform:uppercase;
  opacity:0.65;
  margin-top:10px;
}

/* TEXT */
.tagline{
  margin-top:18px;
  font-size:1rem;
  opacity:0.55;
  color:rgba(255,255,255,0.85);
}

/* LANGUAGE BUTTONS */
.lang{
  margin-top:22px;
}

.lang button{
  background:transparent;
  border:1px solid rgba(255,255,255,0.35);
  color:white;
  padding:6px 16px;
  border-radius:20px;
  margin:4px;
  cursor:pointer;
  transition:0.3s;
  font-size:0.85rem;
}

.lang button:hover{
  background:white;
  color:black;
}

/* SOCIAL */
.social{
  margin-top:22px;
}

.social a{
  display:inline-block;
  margin:6px;
  padding:9px 18px;
  border-radius:30px;
  text-decoration:none;
  color:white;
  border:1px solid rgba(255,255,255,0.25);
  transition:0.3s;
  font-size:0.9rem;
}

.social a:hover{
  background:white;
  color:black;
  transform:translateY(-2px);
}

/* ANIMATIONS */
@keyframes fade{
  from{
    opacity:0;
    transform:translateY(40px);
    filter:blur(6px);
  }
  to{
    opacity:1;
    transform:translateY(0);
    filter:blur(0);
  }
}

@keyframes heroFade{
  from{
    opacity:0;
    transform:translateY(20px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

/* MOBILE */
@media(max-width:768px){
  h1{
    font-size:2.4rem;
  }
}

</style>
</head>

<body>

<div class="card">

  <h1>
    Aga Zamirska
    <span class="small-name">Agata Zamirska</span>
  </h1>

  <p id="text-pl" class="tagline">
    Oficjalna strona w przygotowaniu<br>
    Obserwuj mnie tutaj:
  </p>

  <p id="text-en" class="tagline" style="display:none;">
    Official website coming soon<br>
    Follow me here:
  </p>

  <div class="lang">
    <button onclick="showLang('pl')">PL</button>
    <button onclick="showLang('en')">EN</button>
  </div>

  <div class="social">
    <a href="https://instagram.com/aga.zamirska" target="_blank">Instagram</a>
    <a href="https://www.youtube.com/channel/twoj-link" target="_blank">YouTube</a>
    <a href="https://open.spotify.com/artist/twoj-link" target="_blank">Spotify</a>
  </div>

</div>

<script>
function showLang(lang){
  document.getElementById('text-pl').style.display = (lang==='pl') ? 'block' : 'none';
  document.getElementById('text-en').style.display = (lang==='en') ? 'block' : 'none';
}
</script>

</body>
</html>
